[project]
name = "retail-ab-lab"
version = "0.1.0"
description = "Prices a randomized retail e-mail experiment into a ship / don't-ship decision"
requires-python = ">=3.11"
keywords = ["retail", "marketing", "sales", "finance", "ab-testing", "cuped", "duckdb"]
dependencies = [
    "numpy", "pandas", "scipy", "statsmodels", "duckdb", "openpyxl", "xlrd", "plotly",
    "streamlit>=1.50",
]

[project.optional-dependencies]
api = ["fastapi>=0.115"]
dev = ["pytest", "ruff", "fastapi>=0.115", "httpx", "uvicorn"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
